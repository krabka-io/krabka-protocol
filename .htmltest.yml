# Pilot report: local HTML destinations, stylesheets, images and scripts.
# JS-handled rustdoc source ranges are not literal IDs, so fragments are not
# checked. External HTTP links are verified separately, not by this report.
CheckExternal: false
CheckInternalHash: false
CheckDoctype: false
CheckMailto: false
CheckTel: false
CheckMeta: false
CheckGeneric: false
IgnoreAltMissing: true
IgnoreAltEmpty: true
IgnoreDirectoryMissingTrailingSlash: true
OutputDir: .
