[package]
name = "krabka-trace-context"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "W3C Trace Context propagation helpers shared by Krabka's wire-protocol crates"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-trace-context"
readme = "README.md"
keywords = ["tracing", "opentelemetry", "w3c", "sqlcommenter", "krabka"]
categories = ["development-tools::debugging"]

[lints]
workspace = true

[dependencies]
opentelemetry = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
krabka-pgparser = { version = "0.4.2", git = "https://github.com/krabka-io/gres", rev = "3bcc8bfa6553c31e8eb7e2e9d66059d4daf79bec" }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
