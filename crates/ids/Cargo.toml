[package]
name = "krabka-ids"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Canonical newtypes for Krabka's cross-crate Kafka identifiers (offset, partition index, …)"
repository.workspace = true
documentation = "https://docs.rs/krabka-ids"
readme = "README.md"
keywords = ["kafka", "offset", "partition", "newtype", "krabka"]
categories = ["data-structures"]
# Ship the library source only. The tests, fixtures and benches stay in the
# repository.
include = ["src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md"]

[lints]
workspace = true

# A pure value-type leaf crate: no IO, no async, no crypto, so it stays buildable
# for `wasm32-unknown-unknown` (where, as for krabka-voters, the final binary picks
# `uuid`'s randomness source) and can be depended on by every crate — including
# the observability stack, which does not depend on `krabka-protocol` — that
# needs to name a Kafka offset or partition index without threading a raw integer.
[dependencies]
assert2 = { workspace = true }
base64 = { workspace = true }
derive_more = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
