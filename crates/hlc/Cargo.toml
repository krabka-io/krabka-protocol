[package]
name = "krabka-hlc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Hybrid logical clock stamps that ride on Kafka record headers, with a clock-skew observation seam"
repository.workspace = true
documentation = "https://docs.rs/krabka-hlc"
readme = "README.md"
keywords = ["kafka", "hlc", "clock", "causality", "krabka"]
categories = ["date-and-time", "data-structures"]
# Ship the library source only. The tests, fixtures and benches stay in the
# repository.
include = ["src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md"]

[lints]
workspace = true

# A leaf crate with no IO and no async. It does not depend on `krabka-protocol`,
# so a producer, a consumer, and the observability stack can all stamp and read
# a record without a link against the wire codec. The carriage stays type-erased
# over `(&str, impl AsRef<[u8]>)` header pairs, so any header type works.
[dependencies]
krabka-ids = { version = "0.5.1", path = "../ids" }
krabka-units = { workspace = true }
derive_more = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
proptest = { workspace = true }
