[package]
name = "krabka-voters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "KIP-853 voter-set value types for Krabka (id, directory-id, endpoints, kraft.version)"
repository.workspace = true
documentation = "https://docs.rs/krabka-voters"
readme = "README.md"
keywords = ["kafka", "kraft", "raft", "voters", "krabka"]
categories = ["data-structures"]
# Ship the library source only. The tests, fixtures and benches stay in the
# repository.
include = ["src/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md"]

[lints]
workspace = true

# A pure value-type leaf crate: no IO, no async, no crypto. This keeps it
# buildable for `wasm32-unknown-unknown` so the deterministic consensus core
# (which embeds a `VoterSet` in its `QuorumState`) can compile to WebAssembly
# for the in-browser playground without dragging in the rest of the stack.
[dependencies]
assert2 = { workspace = true }
krabka-ids = { version = "0.5.0", path = "../ids" }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true }

[dev-dependencies]
