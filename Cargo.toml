[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.98.1"
repository = "https://github.com/krabka-io/krabka-protocol"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Every lint below is an error. The groups sit at priority -1 so that the
# single lints after them take precedence. `clippy.toml` holds their settings.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Restriction lints. Clippy leaves these off by default; each one is opted in.
#
# Imports and naming.
absolute_paths = "deny"
str_to_string = "deny"
# Panics in shipped code. `clippy.toml` exempts test code.
expect_used = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
# Placeholders and debugging left behind.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Lost errors, leaks and surprising evaluation.
assertions_on_result_states = "deny"
infinite_loop = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
precedence_bits = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
try_err = "deny"
unused_result_ok = "deny"
# Shared ownership.
clone_on_ref_ptr = "deny"
mutex_atomic = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
# Simpler or clearer equivalents.
as_underscore = "deny"
cfg_not_test = "deny"
doc_include_without_cfg = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
large_include_file = "deny"
map_with_unused_argument_over_ranges = "deny"
needless_raw_strings = "deny"
non_zero_suggestions = "deny"
pathbuf_init_then_push = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
string_lit_chars_any = "deny"
unnecessary_safety_comment = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"

# Nursery lints, picked one by one. The whole group has too many false
# positives to enable.
branches_sharing_code = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
fallible_impl_from = "deny"
imprecise_flops = "deny"
iter_on_single_items = "deny"
literal_string_with_formatting_args = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
non_send_fields_in_send_ty = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_pub_crate = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
string_lit_as_bytes = "deny"
suboptimal_flops = "deny"
too_long_first_doc_paragraph = "deny"
trait_duplication_in_bounds = "deny"
tuple_array_conversions = "deny"
type_repetition_in_bounds = "deny"
unused_peekable = "deny"
use_self = "deny"
useless_let_if_seq = "deny"

# Cargo lints, picked one by one. The whole group also flags duplicate
# versions deep in the dependency tree, which no change here can fix.
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
arbitrary = { version = "1", features = ["derive"] }
arc-swap = "1"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
crc32c = "0.6"
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
# Stable data-driven test harness. Use for file-backed corpora so nextest can
# schedule each fixture as its own test process.
datatest-stable = "0.3.3"
# Derive boilerplate for domain newtypes (Display/From/Into/Deref/AsRef/
# Constructor/FromStr and numeric ops) so wrappers over wire/domain primitives
# stay one-liners. See docs/style_guides/code_style_guide.md#newtypes-for-domain-values.
derive_more = { version = "2", features = ["display", "from", "into", "deref", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
hex = "0.4"
hmac = "0.13"
jsonpath-rust = "1.0"
lz4rip = { version = "0.11.10", default-features = false, features = ["frame"] }
# `lz4rip` has only the fast LZ4 block compressor. `lzzzz` binds the reference
# `liblz4` C library, which is where the LZ4 HC compressor comes from, for
# `krabka-compression`'s `compress_with_level(Lz4, ..)` at a non-default level.
lzzzz = "2.0"
# mutants: `#[cfg_attr(test, mutants::skip)]` attribute for cargo-mutants. Used
# only where `exclude_re` cannot reliably suppress a mutant (struct-field-deletion
# mutants on a live-IO adapter). Dev-dependency only; expands to nothing.
mutants = "0.0.4"
num-traits = "0.2.19"
once_cell = "1"
# Slice 42: OTLP distributed tracing. opentelemetry-otlp 0.32 lines up with
# the tonic 0.14 / prost 0.14 / reqwest 0.13 stack already in the dep graph.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["kdf", "hmac"] }
# Pretty-prints the `syn` AST for krabka-protocol-codegen. rustfmt gives up on a
# line it cannot fit in `max_width` and emits that item with the raw `quote!`
# ` :: ` spacing; prettyplease always renders canonical source, whatever the
# line length. See crates/protocol-codegen/src/fmt.rs.
prettyplease = "0.3"
# quote/proc-macro2/syn build the codegen token stream. The same three crates
# are already in the graph as the proc-macro dependencies of strum and
# derive_more, so the marginal build cost is near zero.
proc-macro2 = "1"
proptest = "1"
quote = "1"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
refined_type = "0.6"
# KIP-848: client-supplied `subscribed_topic_regex` matched against the
# metadata image. Uses RE2-compatible syntax (same regex engine family as
# the JVM's `java.util.regex` for the cases KIP-848 expects to portably
# support); diverges on lookahead/lookbehind which aren't in the KIP-848
# operator-readable subset.
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# rustls-pemfile retired upstream (RUSTSEC-2025-0134, archived 2025-08).
# Use the PEM parsers in `rustls-pki-types` (same code; pull explicitly).
rustls-pki-types = { version = "1.15", features = ["alloc"] }
rustls-webpki = "0.103"
serde = { version = "1", features = ["derive"] }
serde-wincode = "=0.1.2"
serde_json = "1"
sha2 = "0.11"
snap = "1"
# SASL/GSSAPI (Kerberos). `network_client` lets the initiator reach the KDC;
# `ring` keeps crypto provider choice aligned with rustls/rcgen in this workspace.
# `krabka-sspi` is sspi 0.23.0 plus the MIT Kerberos interoperability fixes
# (devolutions/sspi-rs#738) and the #764 fix, published from krabka-io/sspi-rs.
# Its library is still named `sspi`. Return to upstream `sspi` once a release
# contains those fixes; docs/releasing.md says how.
sspi = { package = "krabka-sspi", version = "0.23.0", default-features = false, features = ["network_client", "ring"] }
# strum: derive enum<->&'static str (IntoStaticStr) and &str->enum (EnumString)
# to retire hand-written match-arm conversions. Its whole proc-macro tree
# (syn/quote/proc-macro2/heck/rustversion) is already compiled in the graph,
# so the marginal build cost is one small proc-macro crate.
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
syn = { version = "3", features = ["full", "parsing", "printing"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = "1.1"
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uom = { version = "0.38", default-features = false, features = ["autoconvert", "f64", "si", "std", "use_serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# wincode + serde-wincode replace bincode for serde-derived wire shapes.
# Keep these paired so `SerdeCompat` implements this wincode's traits.
wincode = "=0.6"
x509-parser = "0.18"
zerocopy = { version = "0.8", features = ["derive"] }
zstd = "0.14"

# First-party crates inherited by more than one member.
krabka-security = { path = "crates/security", version = "0.7.0" }
krabka-units = { path = "crates/units", version = "0.7.0" }
