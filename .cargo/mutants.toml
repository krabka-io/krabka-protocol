# cargo-mutants configuration — https://mutants.rs
#
# Read both by a local `cargo mutants` run and by the `cargo_mutants_test`
# targets, which shell out to a real cargo-mutants binary (see //tools/mutants).

test_tool = "nextest"
profile = "mutants"

# A surviving mutant in the codec layer is often only caught by the slower
# corpus and property suites. Give every mutant a generous timeout relative to
# the unmutated baseline so a legitimately-slower-but-correct run is not
# misreported as a timeout survivor.
timeout_multiplier = 5.0
minimum_test_timeout = 120

exclude_globs = [
    # Machine-emitted wire codecs: one encode/decode/populate per record type,
    # regenerated by tools/regenerate.sh in the monorepo. No hand-written logic
    # to mutate, and ~200k lines of it.
    "crates/protocol/generated/**",
]

exclude_re = [
    # The `#[cfg(not(feature = "..."))]` codec stubs in compression/src/lib.rs,
    # each of which just returns `FeatureDisabled`. All four codecs are default
    # features and `bazel cquery` confirms flate2, snap, lz4_flex and zstd are
    # in the build, so this text is not compiled -- mutating it cannot change
    # behaviour, and cargo-mutants reports the no-op as a survivor rather than
    # as unviable. No test can kill a mutant in code that is not built.
    #
    # Anchored on lib.rs and on the prefixed names: the real implementations
    # live in src/gzip.rs and friends as plain `compress`/`decompress`, so they
    # stay in scope.
    "src/lib\\.rs.*replace (gzip|snappy|lz4|zstd)_(de)?compress",

    # ------------------------------------------------------------------
    # Equivalent mutants in metadata/src/feature.rs: each replacement below
    # produces the value the function already returns, so nothing can observe
    # the difference and no test can kill them.
    #
    # NOTE ON WRITING THESE: the name a pattern is matched against carries the
    # return type between the function and `with` --
    #
    #   replace Feature::dependencies -> &'static[(&'static str, i16)] with ...
    #
    # while the failure output prints a shortened form without it. A pattern
    # copied from that output never matches. `cargo-mutants --list` prints the
    # real names; the `.*` below bridges the return type.
    # ------------------------------------------------------------------

    # GROUP_VERSION, SHARE_VERSION and STREAMS_VERSION are all MIN = 0, MAX = 1,
    # so a range rewritten to the literal `(0, 1)` is the same range, and a
    # default rewritten to `0` is the same level.
    "replace <impl Feature for (Group|Share|Streams)VersionFeature>::supported_range .* with \\(0, 1\\)$",
    "replace <impl Feature for (Share|Streams)VersionFeature>::default_level .* with 0$",

    # The default `min_required_floor` returns `supported_range().0`. Every
    # feature inheriting it has a supported min of 0; metadata.version, the one
    # with a floor of 7, overrides the method.
    "replace Feature::min_required_floor .* with 0$",

    # The default `dependencies` returns `&[]`, and `Vec::leak(Vec::new())` is
    # also an empty slice. Only the empty replacement is equivalent -- the
    # `vec![("xyzzy", 1)]` variants beside it are real mutants.
    "replace Feature::dependencies .* with Vec::leak\\(Vec::new\\(\\)\\)$",

    # TV1_METADATA_LEVEL and TV2_METADATA_LEVEL are both 24, so the `>= TV2` arm
    # above already matches everything this guard could. Forced false, control
    # falls to the same `_ => 0`. Forced *true* is a real mutant and stays in
    # scope: below level 24 it would return 1 where the feature returns 0.
    "replace match guard level >= TV1_METADATA_LEVEL with false in <impl Feature for TransactionVersionFeature>::default_level$",

    # `pr.directories.len() < pr.replicas.len()` guards a `resize` that grows
    # the directory vector to match the replica list. Read as `<=`, the extra
    # case is the one where the lengths are already equal, and resizing to the
    # length it already has does nothing. `>` and `==` beside it are real
    # mutants and stay in scope, so this is pinned to the operator and the site.
    #
    # A binary-operator mutant names its function *after* the replacement --
    # "replace < with <= in Type::method" -- which is a third shape again,
    # different from both the whole-function and the match-guard forms above.
    "image\\.rs:821:45: replace < with <= in MetadataImage::apply$",

    # `version < 4` guards clearing `cordoned_log_dirs` before encoding a
    # downgraded RegisterBroker. The field appears nowhere else in this crate:
    # Krabka never populates it, so it is already `None` and the assignment is a
    # no-op whichever way the comparison reads. The guard is defensive against a
    # future encoder that does carry it, and until something sets the field no
    # test can tell these apart.
    "kraft_translate\\.rs:471:28: replace < with (==|>|<=) in to_kraft_values$",

    # `at_end` guards `while !reader.at_end()` in the keytab parser, but the
    # loop body already breaks when the size read comes back `Truncated`. Forced
    # false, the loop runs one extra iteration at end of file, that read fails,
    # and it breaks with the same entries. Forced *true* is a real mutant --
    # nothing would parse -- and stays in scope.
    "keytab\\.rs:89:9: replace Reader<'a>::at_end -> bool with false$",

    # The SSPI wrap/unwrap/handshake path in gssapi/provider.rs. Every one of
    # these takes a live `Kerberos` context, which cannot be built without a
    # KDC, so no `#[cfg(test)]` unit test can reach them.
    #
    # They are not untested: crates/security/tests/gssapi_provider.rs drives
    # accept, step, wrap, unwrap and src_principal against a real KDC. That
    # suite is `#[ignore]`d behind a container fixture, and `cargo_mutants_test`
    # runs only unit tests -- so the coverage exists and this harness cannot see
    # it. Excluded so a red sweep here means "a unit-testable survivor", which
    # is a signal worth having.
    #
    # Matched without a leading `replace`, because these appear under several
    # name shapes -- whole-function replacements, and `delete ! in <fn>` for the
    # negations inside the handshake loops.
    #
    # `kdc_url_from_env` and `is_established` in the same file are pure and stay
    # in scope.
    "provider\\.rs.*(gss_(un)?wrap|<impl Gss(Acceptor for SspiAcceptor|Initiator for SspiInitiator)>::(accept|step|wrap|unwrap|src_principal))",
]
