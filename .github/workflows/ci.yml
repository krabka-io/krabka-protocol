name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: the mutation sweep.
    - cron: "0 5 * * *"

permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write

# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build, test, lint and format. The Aspect CLI narrows each of these to what
  # the change actually touched; `bazel build|test //...` is the equivalent for
  # anyone without the CLI, and is what the nightly job runs.
  ci:
    name: build · test · lint · format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Change detection needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format

      # `aspect lint` narrows to the targets a change touched and annotates the
      # pull request. It reads the `rules_lint_machine` output group, which is
      # why the clippy aspect comes from aspect_rules_lint_rust rather than from
      # @rules_rust -- see //tools/lint/linters.bzl. `bazel test //...` gates on
      # the same aspect through the `*_clippy` targets, for anyone without the
      # CLI.
      - name: lint
        run: aspect lint

      - name: build
        run: aspect build //...

      - name: test
        run: aspect test //...

  # The wire codecs under crates/protocol/generated are committed rather than
  # built, so a schema edit nobody regenerated passes every other job. This one
  # regenerates and fails when the tree moves.
  #
  # Cargo rather than Bazel: the generator shells out to rustfmt, and the
  # regeneration runs `cargo clippy --fix` over the code it has just emitted.
  # The same run covers the four codegen suites that read
  # `crates/protocol/schemas` through `CARGO_MANIFEST_DIR`, which
  # //crates/protocol-codegen tags `manual`.
  codegen:
    name: codegen drift
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the compiler and rustup installs it on the
      # first cargo call. rustfmt is a second pin: rustfmt.toml uses three
      # nightly-gated options, and this is the nightly //MODULE.bazel gives
      # //tools/format, so both formatters agree on the generated tree.
      - name: install the pinned rustfmt nightly
        run: rustup toolchain install nightly-2026-08-14 --profile minimal --component rustfmt

      - name: regenerate
        env:
          KRABKA_RUSTFMT_TOOLCHAIN: nightly-2026-08-14
        run: ./tools/regenerate.sh

      - name: fail on drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::crates/protocol/generated is out of sync with crates/protocol/schemas; run tools/regenerate.sh and commit the result"
            git --no-pager diff
            git status --porcelain
            exit 1
          fi

      - name: codegen tests
        run: cargo test -p krabka-protocol-codegen

  # The byte-level check against Apache Kafka's own client code.
  #
  # `tools/oracle` wraps `kafka-clients` in a line-oriented JSON process. The
  # differential suites send it a message as JSON, and compare its bytes with
  # the Rust encoders. The suites are `#[ignore]`d because they need a JDK, so
  # `bazel test //...` and a plain `cargo test` skip them. This job is the only
  # place they run.
  #
  # `every_tagged_field_byte_equal` gives every KIP-482 tagged field a
  # non-default value at every version. The default-value sweep cannot see a
  # tag written outside its declared versions, because the encoders skip a tag
  # at its default.
  #
  # Cargo rather than Bazel: the suites find the oracle through
  # `CARGO_MANIFEST_DIR`, the same way the codegen suites find the schemas.
  differential:
    name: jvm differential
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          # A warm run downloads neither the Gradle distribution nor the
          # oracle's Maven dependencies. `cache-dependency-path` scopes the key
          # to `tools/oracle`, so an unrelated change does not rotate it.
          cache: gradle
          cache-dependency-path: |
            tools/oracle/**/*.gradle*
            tools/oracle/gradle/wrapper/gradle-wrapper.properties

      # The test binaries and their dev-dependencies are a separate build from
      # every other job, so they get their own cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: jvm-differential

      - name: build the JVM oracle
        # Maven Central rate-limits cold resolves (HTTP 429). Retry with
        # backoff; Gradle keeps what it already downloaded.
        run: |
          for attempt in 1 2 3; do
            if (cd tools/oracle && ./gradlew installDist --no-daemon); then exit 0; fi
            if [ "$attempt" = 3 ]; then echo "::error::gradle installDist failed after 3 attempts"; exit 1; fi
            echo "gradle attempt $attempt failed; backing off"; sleep $((attempt * 45))
          done

      # `--test` selects the suites by name, so a new `differential_*` suite
      # joins without an edit here. `--ignored` runs only the ignored tests,
      # and the other ignored suites (Docker, the MIT KDC) are not selected.
      - name: differential suites
        run: >-
          cargo test --no-fail-fast -p krabka-protocol -p krabka-compression --test 'differential*' --test oracle_smoke -- --ignored

  # LCOV over the first-party crates. Separate from `ci` because instrumented
  # binaries are a different build, so sharing that job's cache would only
  # evict it.
  coverage:
    name: coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
      - run: bazel coverage //crates/...
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: false

  # rustdoc for every crate, kept as an artifact. The `ci` job already builds
  # these -- a `rust_doc` per crate is an ordinary target -- so this exists to
  # publish the output, and to keep rendering the whole set even when `aspect
  # build` narrowed to the crates a change touched.
  docs:
    name: docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docs
          repository-cache: true
      - run: bazel build $(bazel query 'kind("rust_doc rule", //crates/...)')
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error

  # A mutation sweep rebuilds and re-runs a crate's unit tests once per mutant,
  # so it is far too slow to gate a pull request.
  #
  # `continue-on-error`: survivors are the expected state, not an exception --
  # `cargo_mutants_test` runs only `#[cfg(test)]` unit tests, so every mutant the
  # `tests/*.rs` suites would have killed is reported as one. The job exists to
  # produce a list to read. Make it blocking once the score is worth defending.
  mutants:
    name: mutation sweep
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      - id: targets
        run: |
          {
            echo 'targets<<EOF'
            bazel query 'kind("cargo_mutants_test rule", //crates/...)'
            echo EOF
          } >>"${GITHUB_OUTPUT}"
      - run: bazel test ${{ steps.targets.outputs.targets }}
